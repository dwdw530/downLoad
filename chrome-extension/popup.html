<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>daw视频下载助手</title><link rel="stylesheet" href="popup.css"></head>
<body>
  <header><h1>视频下载</h1><label class="toggle"><input id="enabled" type="checkbox" checked><span>识别视频</span></label></header>
  <div class="connection"><span id="connection">正在检查下载器…</span><button id="refresh" type="button" title="刷新资源列表" aria-label="刷新资源列表">↻</button></div>
  <label class="quality">视频清晰度<select id="quality"><option value="480">最高 480p</option><option value="720" selected>最高 720p</option><option value="1080">最高 1080p</option></select></label>
  <main id="items" aria-label="当前标签页的视频"></main>
  <footer id="status" role="status"></footer>
  <script src="popup.js"></script>
</body></html>
